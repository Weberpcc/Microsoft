version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: seomind-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: seomind
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  hindsight:
    image: vectorize/hindsight:latest
    container_name: seomind-hindsight
    ports:
      - "8888:8888"
    environment:
      - PORT=8888
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: seomind-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/seomind
      - SYNC_DATABASE_URL=postgresql://postgres:postgres@postgres:5432/seomind
      - USE_SQLITE_FALLBACK=False
      - HINDSIGHT_API_URL=http://hindsight:8888
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      - SECRET_KEY=${SECRET_KEY:-seo-mind-super-secret-key-change-this-in-production-2026}
    depends_on:
      postgres:
        condition: service_healthy
      hindsight:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: seomind-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
